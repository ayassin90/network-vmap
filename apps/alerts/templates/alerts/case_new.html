{% extends "core/base.html" %}
{% block title %}New case{% endblock %}
{% block content %}
<div class="page-head"><div><p class="crumbs"><a href="{% url 'alerts:cases' %}">Cases</a></p><h1>New case</h1></div></div>
<form method="post" class="card pad form">{% csrf_token %}
<label>Title<input name="title" required value="{% if preset %}{{ preset.hostname }}: {% endif %}"></label>
<label>Description<textarea name="description" rows="4" style="font-family:var(--sans)"></textarea></label>
<label>Priority<select name="priority">{% for k,l in priorities %}<option value="{{ k }}" {% if k == "p3" %}selected{% endif %}>{{ l }}</option>{% endfor %}</select></label>
<label>Assignee<select name="assignee"><option value="">Nobody yet</option>{% for u in users %}<option value="{{ u.pk }}" {% if u == request.user %}selected{% endif %}>{{ u.username }}</option>{% endfor %}</select></label>
<label>Due date<input type="date" name="due"></label>
<label>Devices<select name="devices" multiple size="6">{% for d in devices %}<option value="{{ d.pk }}" {% if preset and preset.pk == d.pk %}selected{% endif %}>{{ d.hostname }}</option>{% endfor %}</select></label>
<div><button class="btn btn-primary">Create case</button></div></form>
{% endblock %}
