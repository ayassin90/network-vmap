<div class="theme-pick {{ extra_class }}" role="group" aria-label="Theme">
  <button type="button" data-theme-set="system" aria-pressed="false" title="Follow the operating system"><svg class="ico" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>System</button>
  <button type="button" data-theme-set="light" aria-pressed="false" title="Light"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Light</button>
  <button type="button" data-theme-set="dark" aria-pressed="false" title="Dark"><svg class="ico" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>Dark</button>
</div>
