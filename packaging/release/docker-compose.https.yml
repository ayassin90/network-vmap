# HTTPS in front of Network VMap: nginx terminates TLS with the certificate in deploy/certs (self-signed by install.sh,
# or yours: replace vmap.crt / vmap.key and run  docker compose restart nginx).
services:
  nginx:
    image: nginx:1.27-alpine
    environment:
      VMAP_HTTPS_PORT: ${VMAP_HTTPS_PORT:-443}
    ports:
      - "${VMAP_HTTPS_PORT:-443}:443"
      - "${VMAP_HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx/vmap.conf.template:/etc/nginx/templates/default.conf.template:ro,z
      - ./deploy/certs:/etc/nginx/certs:ro,z
    depends_on:
      web:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider --no-check-certificate https://127.0.0.1/healthz || exit 1"]
      interval: 15s
      retries: 10
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "5"}
