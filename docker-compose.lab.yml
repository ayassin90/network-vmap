# Mock switch lab: fifteen pretend switches (Cisco IOS/IOS-XE/NX-OS, Aruba CX and AOS-S, Huawei, Juniper, Arista, FortiSwitch) on 172.31.99.0/24 that the worker reaches over SSH and SNMP.
#   docker compose -f docker-compose.yml -f docker-compose.lab.yml up -d --build
# Credentials: SSH vmap / vmap-lab, SNMP v2c community vmap-lab. Seed a discovery with 172.31.99.1.
x-mock: &mock
  build:
    context: .
    dockerfile: tools/mocklab/Dockerfile
  image: vmap-mockswitch:latest
  restart: unless-stopped

services:
  worker:
    networks: [default, lablan]

  receiver:
    networks:
      default:
      lablan:
        ipv4_address: 172.31.99.250

  lab-core-1:
    <<: *mock
    hostname: core-1
    environment:
      LAB_DEVICE: CORE-1
      LAB_IPS: lab
      LAB_SYSLOG: 172.31.99.250
    networks:
      lablan:
        ipv4_address: 172.31.99.1

  lab-core-2:
